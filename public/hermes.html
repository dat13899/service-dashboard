<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>✦ Hermes — Cosmic Dreamscape</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05060f;font-family:system-ui,sans-serif}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;cursor:crosshair}

/* HUD */
#hud{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
  padding:10px 20px;background:rgba(5,6,15,.65);border:1px solid rgba(120,180,255,.15);
  border-radius:14px;backdrop-filter:blur(8px);z-index:10;user-select:none;
  font-size:13px;color:rgba(200,220,255,.7);letter-spacing:.3px;transition:opacity .6s,transform .4s}
#hud.hidden{opacity:0;transform:translateX(-50%) translateY(20px);pointer-events:none}
.hud-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.hud-dot.cyan{background:#5bc0ff;box-shadow:0 0 6px #5bc0ff66}
.hud-dot.pink{background:#ff6bcb;box-shadow:0 0 6px #ff6bcb66}
.hud-dot.gold{background:#ffd700;box-shadow:0 0 6px #ffd70066}
.hud-div{width:1px;height:16px;background:rgba(120,180,255,.2);margin:0 4px}

#title{position:fixed;top:28px;left:50%;transform:translateX(-50%);
  font-size:15px;letter-spacing:4px;text-transform:uppercase;
  color:rgba(200,220,255,.25);z-index:10;pointer-events:none;font-weight:300;transition:opacity 1.5s}

/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#05060f;transition:opacity 1.5s ease}
#splash.fade{opacity:0;pointer-events:none}
#splash svg{width:70px;height:70px;animation:spin 3s linear infinite;opacity:.8}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* hint */
#hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:14px;letter-spacing:2px;color:rgba(200,220,255,.15);
  z-index:5;pointer-events:none;transition:opacity 1.5s;text-align:center;line-height:1.8}

/* palette indicator */
#palette-indicator{position:fixed;top:28px;right:28px;z-index:10;
  display:flex;gap:6px;align-items:center;transition:opacity .6s}
.palette-dot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.1);transition:all .3s;cursor:pointer}
.palette-dot.active{border-color:rgba(255,255,255,.5);transform:scale(1.3);box-shadow:0 0 8px currentColor}

/* volume toggle */
#vol-toggle{position:fixed;bottom:28px;right:28px;z-index:10;
  width:36px;height:36px;border-radius:50%;background:rgba(5,6,15,.55);border:1px solid rgba(120,180,255,.12);
  display:flex;align-items:center;justify-content:center;
  color:rgba(200,220,255,.5);font-size:16px;cursor:pointer;transition:.3s;user-select:none}
#vol-toggle:hover{background:rgba(5,6,15,.8);border-color:rgba(120,180,255,.3);color:rgba(200,220,255,.8)}

/* keys help */
#keys-help{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9;
  display:flex;gap:14px;font-size:11px;color:rgba(200,220,255,.12);letter-spacing:1px;transition:opacity 2s;pointer-events:none}
.key-badge{padding:4px 8px;border:1px solid rgba(200,220,255,.06);border-radius:6px;
  background:rgba(5,6,15,.3);font-size:10px;letter-spacing:.5px}

/* constellation label */
#constellation{position:fixed;z-index:5;pointer-events:none;
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(200,220,255,.03);transition:all 3s ease;opacity:0}
#constellation.show{opacity:1;color:rgba(200,220,255,.06)}
</style>
</head>
<body>
<div id="splash"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(91,192,255,.4)" stroke-width="2" stroke-dasharray="80 30"/><circle cx="50" cy="50" r="20" fill="none" stroke="rgba(255,107,203,.4)" stroke-width="2" stroke-dasharray="40 20"/></svg></div>
<div id="hint">✦ move mouse · click explode · 1-6 palettes · space boom · H hud ✦</div>
<div id="title">✦ hermes — cosmic dreamscape ✦</div>
<div id="palette-indicator"></div>
<div id="keys-help">
  <span class="key-badge">1-6 palette</span>
  <span class="key-badge">SPACE boom</span>
  <span class="key-badge">H hud</span>
  <span class="key-badge">M audio</span>
</div>
<div id="constellation">✦ wandering through the cosmos ✦</div>
<div id="hud">
  <span><span class="hud-dot cyan"></span><span id="starsC">0</span> stars</span>
  <span class="hud-div"></span>
  <span><span class="hud-dot pink"></span><span id="particlesC">0</span> particles</span>
  <span class="hud-div"></span>
  <span><span class="hud-dot gold"></span><span id="shootersC">0</span> meteors</span>
  <span class="hud-div"></span>
  <span id="fpsC">0</span> fps
  <span class="hud-div"></span>
  <span id="palette-name" style="font-size:11px;opacity:.6">NEBULA</span>
</div>
<div id="vol-toggle">♪</div>
<canvas id="c"></canvas>
<script>
// ─── Cosmic Dreamscape v2 — with audio, palettes, shooting stars ──────
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;ctx.imageSmoothingEnabled=false}
resize();addEventListener('resize',resize);

const PI2=Math.PI*2;
const rand=(min,max)=>Math.random()*(max-min)+min;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>v<lo?lo:v>hi?hi:v;

// ─── Color Palettes ──────────────────────────────────────────────────
const PALETTES=[
  {name:'NEBULA', stars:'#fff', web:'hsla(220,100%,70%,VAR)', bg:[5,6,15],
    nebula:[[40,80,180],[120,40,160],[180,60,120],[30,120,140],[90,30,140]],
    partHue:[190,330], partSat:[60,100], partLig:[55,85]},
  {name:'SUNSET', stars:'#ffe', web:'hsla(10,90%,65%,VAR)', bg:[20,8,10],
    nebula:[[200,50,30],[180,70,40],[140,60,50],[100,30,70],[60,10,80]],
    partHue:[0,50], partSat:[70,100], partLig:[55,85]},
  {name:'AURORA', stars:'#eff', web:'hsla(140,80%,65%,VAR)', bg:[5,20,20],
    nebula:[[30,120,80],[20,80,120],[40,160,60],[60,140,100],[80,40,140]],
    partHue:[100,200], partSat:[60,100], partLig:[55,85]},
  {name:'DEEPSEA', stars:'#cdf', web:'hsla(200,60%,50%,VAR)', bg:[2,6,25],
    nebula:[[10,20,100],[20,40,140],[10,60,120],[5,30,160],[40,10,130]],
    partHue:[160,260], partSat:[50,90], partLig:[45,75]},
  {name:'LAVA', stars:'#fda', web:'hsla(30,100%,60%,VAR)', bg:[25,8,5],
    nebula:[[180,40,10],[200,60,20],[160,80,30],[100,20,10],[140,10,5]],
    partHue:[0,40], partSat:[80,100], partLig:[55,90]},
  {name:'VOID', stars:'#aac', web:'hsla(280,60%,50%,VAR)', bg:[8,6,20],
    nebula:[[60,20,100],[80,40,120],[40,20,80],[100,30,140],[20,10,60]],
    partHue:[240,310], partSat:[50,80], partLig:[45,75]},
];
let paletteIdx=0;
let paletteTarget=0;
let paletteTransition=1; // 1=done

// ─── Stars ──────────────────────────────────────────────────────────
const STARS_CNT=800;
const stars=[];
for(let i=0;i<STARS_CNT;i++){
  const layer=Math.floor(rand(0,3));
  stars.push({
    x:rand(0,W),y:rand(0,H),
    size:layer===0?rand(.3,.7):layer===1?rand(.7,1.5):rand(1.5,3),
    layer,
    baseAlpha:layer===0?rand(.2,.5):layer===1?rand(.4,.7):rand(.6,1),
    twinkleSpeed:rand(.3,3.5),
    twinklePhase:rand(0,PI2),
    hueShift:rand(-20,20)
  });
}

// ─── Nebula clouds ──────────────────────────────────────────────────
const NEBULA_CNT=10;
const nebulas=[];
for(let i=0;i<NEBULA_CNT;i++){
  nebulas.push({
    x:rand(0,W),y:rand(0,H),
    vx:rand(-.06,.06),vy:rand(-.06,.06),
    radius:rand(100,300),
    alpha:rand(.03,.08),
    pulse:rand(.2,.7),pulseSpeed:rand(.001,.004),
    phase:rand(0,PI2),
    ci:i
  });
}

// ─── Particles ──────────────────────────────────────────────────────
const MAX_PARTICLES=120;
const particles=[];
let mouse={x:W/2,y:H/2,active:false};
let clickBoom=false,boomTimer=0;

addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});
addEventListener('click',()=>{doExplosion(mouse.x,mouse.y,40)});
addEventListener('touchmove',e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;mouse.active=true},{passive:true});
addEventListener('touchstart',e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;mouse.active=true;doExplosion(mouse.x,mouse.y,30)},{passive:true});

function doExplosion(x,y,count){
  clickBoom=true;boomTimer=1;
  for(let i=0;i<count;i++){
    if(particles.length>=MAX_PARTICLES)break;
    const ang=rand(0,PI2),spd=rand(80,300);
    particles.push(createParticle(x,y,Math.cos(ang)*spd,Math.sin(ang)*spd,true));
  }
}

function createParticle(x,y,vx,vy,explosion=false){
  const p=PALETTES[paletteIdx];
  return{
    x,y,vx,vy,
    life:1,decay:explosion?rand(.006,.015):rand(.0015,.005),
    size:explosion?rand(2,6):rand(1.5,4.5),
    hue:rand(p.partHue[0],p.partHue[1]),
    sat:rand(p.partSat[0],p.partSat[1]),
    lig:rand(p.partLig[0],p.partLig[1]),
    trail:[],oscPhase:rand(0,PI2)
  };
}

// seed particles
for(let i=0;i<20;i++){
  const ang=rand(0,PI2),spd=rand(10,50);
  particles.push(createParticle(rand(0,W),rand(0,H),Math.cos(ang)*spd,Math.sin(ang)*spd));
}

// ─── Shooting Stars ─────────────────────────────────────────────────
const SHOOTER_INTERVAL=3000; // ms between spawn attempts
let shooterTimer=rand(0,SHOOTER_INTERVAL);
const shooters=[];
function spawnShooter(){
  const angle=rand(-.4,.4)-Math.PI/2; // mostly downward, slightly angled
  const speed=rand(800,2000);
  const x=rand(0,W);
  const y=rand(-H*.1,0);
  const len=rand(60,200);
  shooters.push({
    x,y,
    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,
    len,
    life:1,
    decay:rand(.008,.02),
    width:rand(1,3),
  });
}

// ─── Web Audio — Generative Ambient ─────────────────────────────────
let audioCtx=null;
let audioGain=null;
let audioNodes=[];
let audioEnabled=false;
let audioInitialized=false;

function initAudio(){
  if(audioInitialized)return;
  audioInitialized=true;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    audioGain=audioCtx.createGain();
    audioGain.gain.value=0;
    audioGain.connect(audioCtx.destination);

    // Fade in over 3s
    const now=audioCtx.currentTime;
    audioGain.gain.setValueAtTime(0,now);
    audioGain.gain.linearRampToValueAtTime(.18,now+3);

    // ── Drone 1: deep sub-bass ──
    const osc1=audioCtx.createOscillator();
    osc1.type='sine';
    osc1.frequency.value=27.5; // A0
    const g1=audioCtx.createGain();
    g1.gain.value=.12;
    const lfo1=audioCtx.createOscillator();
    lfo1.frequency.value=.3;
    const gLfo1=audioCtx.createGain();
    gLfo1.gain.value=4;
    lfo1.connect(gLfo1);
    gLfo1.connect(osc1.frequency);
    osc1.connect(g1);
    g1.connect(audioGain);
    osc1.start();
    lfo1.start();
    audioNodes.push(osc1,lfo1);

    // ── Drone 2: fifth ──
    const osc2=audioCtx.createOscillator();
    osc2.type='sine';
    osc2.frequency.value=41.2; // E1
    const g2=audioCtx.createGain();
    g2.gain.value=.08;
    const lfo2=audioCtx.createOscillator();
    lfo2.frequency.value=.5;
    const gLfo2=audioCtx.createGain();
    gLfo2.gain.value=3;
    lfo2.connect(gLfo2);
    gLfo2.connect(osc2.frequency);
    osc2.connect(g2);
    g2.connect(audioGain);
    osc2.start();
    lfo2.start();
    audioNodes.push(osc2,lfo2);

    // ── Pad: filtered noise ──
    const bufSize=audioCtx.sampleRate*2;
    const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++)data[i]=Math.random()*2-1;
    const noiseSrc=audioCtx.createBufferSource();
    noiseSrc.buffer=buf;
    noiseSrc.loop=true;
    const bp=audioCtx.createBiquadFilter();
    bp.type='bandpass';
    bp.frequency.value=200;
    bp.Q.value=2;
    const g3=audioCtx.createGain();
    g3.gain.value=.04;
    const lfo3=audioCtx.createOscillator();
    lfo3.frequency.value=.08;
    const gLfo3=audioCtx.createGain();
    gLfo3.gain.value=150;
    lfo3.connect(gLfo3);
    gLfo3.connect(bp.frequency);
    noiseSrc.connect(bp);
    bp.connect(g3);
    g3.connect(audioGain);
    noiseSrc.start();
    lfo3.start();
    audioNodes.push(noiseSrc,lfo3);

    // ── High shimmer ──
    const osc3=audioCtx.createOscillator();
    osc3.type='triangle';
    osc3.frequency.value=880;
    const g4=audioCtx.createGain();
    g4.gain.value=.02;
    const lfo4=audioCtx.createOscillator();
    lfo4.frequency.value=.15;
    const gLfo4=audioCtx.createGain();
    gLfo4.gain.value=440;
    lfo4.connect(gLfo4);
    gLfo4.connect(osc3.frequency);
    osc3.connect(g4);
    g4.connect(audioGain);
    osc3.start();
    lfo4.start();
    audioNodes.push(osc3,lfo4);

    // ── Melodic chime (repeating) ──
    function scheduleChime(){
      if(!audioEnabled)return;
      const chimeNow=audioCtx.currentTime;
      const chimeOsc=audioCtx.createOscillator();
      chimeOsc.type='sine';
      const chimeG=audioCtx.createGain();
      chimeG.gain.setValueAtTime(0,chimeNow);
      const notes=[261.63,293.66,329.63,392,440,523.25];
      const note=notes[Math.floor(Math.random()*notes.length)];
      chimeOsc.frequency.value=note;
      const startTime=chimeNow+rand(4,12);
      chimeG.gain.linearRampToValueAtTime(.03,startTime+.1);
      chimeG.gain.exponentialRampToValueAtTime(.001,startTime+rand(1.5,4));
      chimeOsc.connect(chimeG);
      chimeG.connect(audioGain);
      chimeOsc.start(startTime);
      chimeOsc.stop(startTime+5);
      setTimeout(scheduleChime,(rand(6,18))*1000);
    }
    scheduleChime();

    audioEnabled=true;
    document.getElementById('vol-toggle').textContent='♫';
    document.getElementById('vol-toggle').style.color='rgba(91,192,255,.8)';
  }catch(e){
    console.warn('Audio init failed:',e);
    document.getElementById('vol-toggle').style.display='none';
  }
}

function toggleAudio(){
  if(!audioInitialized){
    initAudio();
    return;
  }
  audioEnabled=!audioEnabled;
  const now=audioCtx.currentTime;
  if(audioEnabled){
    audioGain.gain.linearRampToValueAtTime(.18,now+2);
    document.getElementById('vol-toggle').textContent='♫';
    document.getElementById('vol-toggle').style.color='rgba(91,192,255,.8)';
    scheduleChime();
  }else{
    audioGain.gain.linearRampToValueAtTime(0,now+1);
    document.getElementById('vol-toggle').textContent='♪';
    document.getElementById('vol-toggle').style.color='rgba(200,220,255,.5)';
  }
}

document.getElementById('vol-toggle').addEventListener('click',toggleAudio);

// ─── Update palette indicator ──────────────────────────────────────
function buildPaletteUI(){
  const container=document.getElementById('palette-indicator');
  container.innerHTML='';
  PALETTES.forEach((p,i)=>{
    const dot=document.createElement('div');
    dot.className='palette-dot'+ (i===paletteIdx?' active':'');
    const col=PALETTES[i].nebula[0];
    dot.style.background=`rgb(${col[0]},${col[1]},${col[2]})`;
    dot.style.color=`rgb(${col[0]},${col[1]},${col[2]})`;
    dot.addEventListener('click',()=>setPalette(i));
    container.appendChild(dot);
  });
}
buildPaletteUI();

function setPalette(idx){
  if(idx===paletteIdx&&paletteTransition>=1)return;
  paletteTarget=idx;
  paletteTransition=0;
}

// ─── Keyboard Controls ──────────────────────────────────────────────
addEventListener('keydown',e=>{
  const k=e.key;
  // 1-6: palette
  const n=parseInt(k);
  if(n>=1&&n<=PALETTES.length){e.preventDefault();setPalette(n-1)}
  // Space: explode
  if(k===' '||k==='Space'){e.preventDefault();doExplosion(mouse.x,mouse.y,50)}
  // H: toggle hud
  if(k==='h'||k==='H'){document.getElementById('hud').classList.toggle('hidden')}
  // M: toggle audio
  if(k==='m'||k==='M'){e.preventDefault();toggleAudio()}
});

// ─── Drawing ────────────────────────────────────────────────────────
let prevTime=0;let frameCount=0;let fpsTimer=0;let fps=0;
const MAX_TRAIL=8;
const ABSORB=0.08;
const repelForce=0.15;

// Constellation label wander
const constel=document.getElementById('constellation');
let constelTimer=0;

function updatePalette(dt){
  if(paletteTransition>=1)return;
  paletteTransition=Math.min(1,paletteTransition+dt*.001);
  if(paletteTransition>=1)paletteIdx=paletteTarget;
  const pname=PALETTES[paletteTransition>=1?paletteIdx:paletteTarget].name;
  document.getElementById('palette-name').textContent=pname;
  // update dots
  document.querySelectorAll('.palette-dot').forEach((dot,i)=>{
    dot.classList.toggle('active',i===paletteIdx||(paletteTransition<1&&i===paletteTarget));
  });
}

function drawStars(time){
  const p=PALETTES[paletteIdx];
  for(const s of stars){
    const twinkle=Math.sin(time*s.twinkleSpeed+s.twinklePhase)*.4+.6;
    const a=s.baseAlpha*twinkle;
    ctx.globalAlpha=a;
    // parallax
    const px=s.x-(mouse.x-s.x)*.001*(s.layer+1);
    const py=s.y-(mouse.y-s.y)*.001*(s.layer+1);
    // star glow for bright ones
    if(s.layer===2&&s.size>1.8){
      ctx.fillStyle='rgba(255,255,255,.03)';
      ctx.beginPath();ctx.arc(px,py,s.size*5,0,PI2);ctx.fill();
    }
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(px,py,s.size,0,PI2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawNebulas(time){
  const p=PALETTES[paletteIdx];
  for(let i=0;i<NEBULA_CNT;i++){
    const n=nebulas[i];
    n.x+=n.vx;n.y+=n.vy;
    if(n.x<-n.radius)n.x=W+n.radius;
    if(n.x>W+n.radius)n.x=-n.radius;
    if(n.y<-n.radius)n.y=H+n.radius;
    if(n.y>H+n.radius)n.y=-n.radius;
    const pulse=1+Math.sin(time*n.pulseSpeed+n.phase)*n.pulse*.5;
    const r=n.radius*pulse;

    // blend between current and target palette's nebula colors
    const srcIdx=paletteTransition>=1?paletteIdx:paletteTarget;
    const c=PALETTES[srcIdx].nebula[i%PALETTES[srcIdx].nebula.length];
    const alpha=n.alpha;

    const grad=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r);
    grad.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${alpha})`);
    grad.addColorStop(.5,`rgba(${c[0]},${c[1]},${c[2]},${alpha*.35})`);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,PI2);ctx.fill();
  }
}

function drawShooters(time,dt){
  let alive=0;
  ctx.globalAlpha=1;
  for(let i=shooters.length-1;i>=0;i--){
    const s=shooters[i];
    s.life-=s.decay*dt;
    if(s.life<=0){shooters.splice(i,1);continue}
    alive++;
    const tx=s.x+s.vx*dt*.016;
    const ty=s.y+s.vy*dt*.016;
    const dx=tx-s.x,dy=ty-s.y;
    const dist=Math.sqrt(dx*dx+dy*dy);

    // head glow
    const glow=ctx.createRadialGradient(tx,ty,0,tx,ty,s.width*8);
    glow.addColorStop(0,`rgba(255,240,210,${s.life*.4})`);
    glow.addColorStop(.5,`rgba(255,200,150,${s.life*.1})`);
    glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow;
    ctx.beginPath();ctx.arc(tx,ty,s.width*8,0,PI2);ctx.fill();

    // trail
    const tLen=Math.min(30,Math.floor(dist/10));
    ctx.globalAlpha=s.life*.6;
    ctx.strokeStyle='rgba(255,230,200,.6)';
    ctx.lineWidth=s.width;
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(tx,ty);
    ctx.stroke();

    // bright head
    ctx.globalAlpha=s.life;
    ctx.fillStyle='#fffbe6';
    ctx.shadowColor='rgba(255,230,180,.8)';
    ctx.shadowBlur=s.width*10;
    ctx.beginPath();ctx.arc(tx,ty,s.width,0,PI2);ctx.fill();
    ctx.shadowBlur=0;

    s.x=tx;s.y=ty;
  }
  ctx.globalAlpha=1;
  document.getElementById('shootersC').textContent=alive;
}

function drawParticles(dt){
  const connDist=200;
  const mousePull=.15;
  let aliveCt=0;

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=p.decay*dt;
    if(p.life<=0){particles.splice(i,1);continue}
    aliveCt++;

    // boom repel
    if(!p._exploded&&clickBoom&&boomTimer>.5){
      const dx=mouse.x-p.x,dy=mouse.y-p.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<200){
        const force=8/(dist+.1);
        p.vx-=dx*force;p.vy-=dy*force;
        p._exploded=true;
      }
    }

    // attract to mouse
    const dx=mouse.x-p.x,dy=mouse.y-p.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>5){
      p.vx+=dx*mousePull*2/(dist+10);
      p.vy+=dy*mousePull*2/(dist+10);
    }

    // repel from other particles (soft)
    for(let j=i+1;j<particles.length;j++){
      const o=particles[j];
      const rdx=p.x-o.x,rdy=p.y-o.y;
      const rd=Math.sqrt(rdx*rdx+rdy*rdy);
      if(rd<15&&rd>.1){
        const f=repelForce/(rd*rd+1);
        p.vx+=rdx*f;p.vy+=rdy*f;
        o.vx-=rdx*f;o.vy-=rdy*f;
      }
    }

    // damping
    p.vx*=.98;p.vy*=.98;
    p.x+=p.vx*dt*.016;p.y+=p.vy*dt*.016;

    // wrap
    if(p.x<-20)p.x=W+20;
    if(p.x>W+20)p.x=-20;
    if(p.y<-20)p.y=H+20;
    if(p.y>H+20)p.y=-20;

    // trail
    p.trail.push({x:p.x,y:p.y});
    if(p.trail.length>MAX_TRAIL)p.trail.shift();

    const pCol=PALETTES[paletteIdx];

    // draw trail
    const tLen=p.trail.length;
    for(let t=1;t<tLen;t++){
      const ta=t/tLen;
      ctx.globalAlpha=ta*.12*p.life;
      ctx.strokeStyle=`hsla(${p.hue},${p.sat}%,${p.lig+10}%,1)`;
      ctx.lineWidth=p.size*ta*.35;
      ctx.beginPath();
      ctx.moveTo(p.trail[t-1].x,p.trail[t-1].y);
      ctx.lineTo(p.trail[t].x,p.trail[t].y);
      ctx.stroke();
    }

    // glow
    ctx.globalAlpha=p.life*.6;
    const glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*4);
    glow.addColorStop(0,`hsla(${p.hue},${p.sat}%,${p.lig}%,.5)`);
    glow.addColorStop(.4,`hsla(${p.hue},${p.sat}%,${p.lig}%,.15)`);
    glow.addColorStop(1,'hsla(0,0%,100%,0)');
    ctx.fillStyle=glow;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*3.5,0,PI2);ctx.fill();

    // core
    ctx.globalAlpha=1;
    ctx.fillStyle=`hsla(${p.hue},${p.sat}%,${p.lig}%,.9)`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,PI2);ctx.fill();
  }

  // connections (dynamic alpha based on audio)
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const a=particles[i],b=particles[j];
      const dx=a.x-b.x,dy=a.y-b.y;
      const d=dx*dx+dy*dy;
      if(d<connDist*connDist){
        const alpha=(1-d/(connDist*connDist))*.3*Math.min(a.life,b.life);
        ctx.globalAlpha=alpha;
        ctx.strokeStyle=`hsla(${(a.hue+b.hue)/2},70%,70%,${alpha})`;
        ctx.lineWidth=.5;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      }
    }
  }

  ctx.globalAlpha=1;
  particles.length>0&&(document.getElementById('particlesC').textContent=particles.length);
  return aliveCt;
}

// ─── Loop ───────────────────────────────────────────────────────────
function loop(time){
  const dt=Math.min(time-prevTime||16,50);
  prevTime=time;
  frameCount++;
  fpsTimer+=dt;
  if(fpsTimer>=1000){fps=frameCount;frameCount=0;fpsTimer-=1000;
    document.getElementById('fpsC').textContent=fps;
  }

  // fade trail bg
  ctx.fillStyle='rgba(5,6,15,.12)';
  ctx.fillRect(0,0,W,H);

  updatePalette(dt);

  // layers
  drawNebulas(time);
  drawStars(time);
  drawShooters(time,dt);
  drawParticles(dt);

  // boom decay
  if(clickBoom){boomTimer-=dt*.001;
    if(boomTimer<=0){clickBoom=false;boomTimer=0}
  }

  // shooting stars
  shooterTimer-=dt;
  if(shooterTimer<=0){
    shooterTimer=SHOOTER_INTERVAL+rand(-1000,2000);
    if(Math.random()<.6)spawnShooter();
  }

  // constellation label wander
  constelTimer+=dt;
  if(constelTimer>8000&&constelTimer<18000){
    constel.classList.add('show');
    constel.style.left=rand(10,70)+'%';
    constel.style.top=rand(20,60)+'%';
  }else if(constelTimer>=20000){
    constel.classList.remove('show');
    if(constelTimer>25000)constelTimer=0;
  }

  // hud counts
  document.getElementById('starsC').textContent=STARS_CNT;

  requestAnimationFrame(loop);
}

// ─── Start ──────────────────────────────────────────────────────────
setTimeout(()=>document.getElementById('splash').classList.add('fade'),800);
setTimeout(()=>{const h=document.getElementById('hint');h.style.opacity='0'},6000);
setTimeout(()=>document.getElementById('title').style.opacity='0',9000);
setTimeout(()=>document.getElementById('keys-help').style.opacity='0',12000);

// Init audio on first interaction (autoplay policy)
document.addEventListener('click',()=>{if(!audioInitialized)initAudio()},{once:true});
document.addEventListener('touchstart',()=>{if(!audioInitialized)initAudio()},{once:true});

requestAnimationFrame(loop);
</script>
